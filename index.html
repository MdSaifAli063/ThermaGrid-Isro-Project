<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ThermaGrid — Urban heat island detection and cooling AI for Indian cities." />
    <title>ThermaGrid · Urban Heat Island AI</title>
    <script>
      (function () {
        var stored = localStorage.getItem("thermagrid-theme") || "system";
        var dark =
          stored === "dark" ||
          (stored === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
